{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h2>🍱 Food Donations</h2>
</div>

<div class="card-grid">

    {% for d in donations %}
    <div class="donation-card">

        <h3>{{ d[1] }}</h3>

        <p>🍛 <b>Food:</b> {{ d[2] }}</p>
        <p>📦 <b>Quantity:</b> {{ d[3] }}</p>
        <p>📍 <b>Location:</b> {{ d[4] }}</p>

    </div>
    {% endfor %}

</div>

{% endblock %}
