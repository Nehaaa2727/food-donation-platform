{% extends "base.html" %}

{% block content %}

<h2>Food Donation Locations</h2>

<div id="map" style="height:500px; width:100%;"></div>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    var map = L.map('map').setView([28.6139, 77.2090], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ✅ Safe data handling
    var donors = JSON.parse(
        document.getElementById("donor-data").textContent
    );

    donors.forEach(function(d) {
        if (d.latitude != null && d.longitude != null) {

            var lat = parseFloat(d.latitude);
            var lng = parseFloat(d.longitude);

            L.marker([lat, lng])
                .addTo(map)
                .bindPopup(
                    "<b>Name:</b> " + d.name + "<br>" +
                    "<b>Food:</b> " + d.food_item + "<br>" +
                    "<b>Quantity:</b> " + d.quantity + "<br>" +
                    "<b>Location:</b> " + d.location
                );
        }
    });
</script>

{% endblock %}
