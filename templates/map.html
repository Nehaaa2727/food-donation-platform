{% extends "base.html" %}

{% block content %}

<h2>Food Donation Locations</h2>

<div id="map" style="height:500px; width:100%;"></div>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    var map = L.map('map').setView([28.6139, 77.2090], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'OSM'
    }).addTo(map);

    var donors = JSON.parse(document.getElementById("donor-data").textContent);

    console.log("DATA:", donors);

    donors.forEach(function(d) {
        console.log(d.latitude, d.longitude);

        if (d.latitude != null && d.longitude != null) {
            L.marker([Number(d.latitude), Number(d.longitude)])
                .addTo(map)
                .bindPopup(d.name);
        }
    });
</script>

{% endblock %}
