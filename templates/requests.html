{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h2>🙋 Food Requests</h2>
</div>

<div class="card-grid">

    {% for r in requests %}
    <div class="donation-card">

        <h3>{{ r[1] }}</h3>

        <p>🍛 <b>Food Needed:</b> {{ r[2] }}</p>
        <p>📦 <b>Quantity:</b> {{ r[3] }}</p>
        <p>📍 <b>Location:</b> {{ r[4] }}</p>

    </div>
    {% endfor %}

</div>

{% endblock %}
