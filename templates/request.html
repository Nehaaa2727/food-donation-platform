
{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>🙋 Request Food</h2>

    <form method="POST">

        <input type="text" name="receiver_name" placeholder="Your Name" required>

        <input type="text" name="food_needed" placeholder="Food Needed (e.g. Rice, Roti)" required>

        <input type="text" name="quantity" placeholder="Quantity (e.g. 5 plates / 2 kg)" required>

        <input type="text" name="location" placeholder="Your Location" required>

        <button type="submit">Submit Request</button>

    </form>

</div>

{% endblock %}
